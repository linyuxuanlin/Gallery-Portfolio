<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<title>POUR. — 3D 手冲练习场</title>
<meta name="theme-color" content="#0d0d0c"/>
<style>
:root{--bg:#0d0d0c;--panel:rgba(24,24,21,.82);--text:#f2efe8;--muted:#aaa79f;--line:rgba(255,255,255,.12);--accent:#e8c07b;--good:#a7dfb0;--bad:#f29b88}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
.topbar{position:absolute;left:0;right:0;top:0;padding:max(18px,env(safe-area-inset-top)) 18px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}.brand{font-size:20px;letter-spacing:.22em;font-weight:800}.sub{font-size:11px;color:var(--muted);margin-top:5px}.mode{border:1px solid var(--line);background:rgba(0,0,0,.32);backdrop-filter:blur(12px);border-radius:999px;padding:8px 11px;font-size:11px;color:var(--muted)}
.hud{position:absolute;left:50%;top:74px;transform:translateX(-50%);display:flex;gap:6px;z-index:4;pointer-events:none}.metric{min-width:72px;padding:8px;border:1px solid var(--line);background:rgba(10,10,9,.55);backdrop-filter:blur(10px);border-radius:13px;text-align:center}.metric b{display:block;font-size:16px;font-variant-numeric:tabular-nums}.metric span{font-size:8px;color:var(--muted);letter-spacing:.05em}
.panel{position:absolute;z-index:5;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(720px,calc(100% - 24px));padding:12px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(18px);border-radius:20px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.status{font-size:12px;color:var(--muted);line-height:1.45}.status strong{color:var(--text)}button{appearance:none;border:0;border-radius:14px;padding:11px 14px;font-weight:700;cursor:pointer;background:var(--text);color:#171714}button.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}button.ghostbtn{background:rgba(167,223,176,.14);color:var(--good);border:1px solid rgba(167,223,176,.35)}button:disabled{opacity:.35}.buttons{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.progress{height:5px;margin-top:10px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#f1e2bb)}.tip{margin-top:8px;font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}.score{color:var(--good)}.flowctl{margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}.flowctl label{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:6px}.flowctl b{color:var(--text)}.flowctl input{width:100%;accent-color:var(--accent)}#hint{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);font-size:12px;color:rgba(255,255,255,.68);pointer-events:none;z-index:3}.hide{opacity:0}
@media(max-width:560px){.hud{top:66px;gap:3px;width:calc(100% - 12px);justify-content:center}.metric{min-width:0;flex:1;max-width:76px;padding:7px 2px}.metric b{font-size:13px}.metric span{font-size:7px}.panel{padding:10px}.row{grid-template-columns:1fr}.buttons{justify-content:stretch}.buttons button{padding:10px 9px;flex:1}.sub{display:none}.tip{font-size:9px}.mode{font-size:10px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="topbar"><div><div class="brand">POUR.</div><div class="sub">PRACTICE · BREW · GHOST</div></div><div class="mode" id="modeLabel">V60 · TRAINING</div></div>
<div class="hud">
  <div class="metric"><b id="time">0:00</b><span>TIME</span></div>
  <div class="metric"><b id="water">0g</b><span>WATER</span></div>
  <div class="metric"><b id="flow">0.0</b><span>FLOW</span></div>
  <div class="metric"><b id="coverage">0%</b><span>COVERAGE</span></div>
  <div class="metric"><b id="uniformity">100%</b><span>UNIFORMITY</span></div>
  <div class="metric"><b id="ghostDelta">--</b><span>GHOST Δ</span></div>
</div>
<div id="hint">移动选择落点 · 按住开始注水</div>
<div class="panel"><div class="row"><div class="status"><strong id="phase">准备开始</strong><br><span id="coach">目标：250g · 建议 4–6 g/s</span></div><div class="buttons"><button class="ghostbtn" id="ghostMode" disabled>跟冲上杯</button><button class="secondary" id="replay" disabled>回放上杯</button><button class="secondary" id="reset">重置</button><button id="start">开始训练</button></div></div><div class="progress"><i id="bar"></i></div><div class="tip"><span id="tipText">粉床会记录局部湿润与过度冲刷</span><span id="score" class="score">评分 --</span></div><div class="flowctl"><label>壶身倾角 / 目标流速 <b id="flowSet">5.0 g/s</b></label><input id="flowControl" type="range" min="2" max="8" value="5" step="0.1"/></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const $=id=>document.getElementById(id),mount=$('app'),scene=new THREE.Scene();scene.background=new THREE.Color(0x0d0d0c);scene.fog=new THREE.Fog(0x0d0d0c,7,14);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,50);camera.position.set(0,3,6.8);camera.lookAt(0,.8,0);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;mount.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xfff4dd,0x1a1a20,2.1));const key=new THREE.DirectionalLight(0xffe6c0,3.2);key.position.set(3,5,4);key.castShadow=true;scene.add(key);
const table=new THREE.Mesh(new THREE.CylinderGeometry(4.6,4.6,.26,64),new THREE.MeshStandardMaterial({color:0x23221e,roughness:.86}));table.position.y=-.82;scene.add(table);
const server=new THREE.Mesh(new THREE.CylinderGeometry(.76,.86,1.3,48,1,true),new THREE.MeshPhysicalMaterial({color:0x6b4430,transparent:true,opacity:.4,roughness:.12,transmission:.18}));server.position.y=-.1;scene.add(server);
const cone=new THREE.Mesh(new THREE.CylinderGeometry(1.08,.40,1.62,64,1,true),new THREE.MeshPhysicalMaterial({color:0xf0f0e8,transparent:true,opacity:.52,roughness:.18,transmission:.18,side:THREE.DoubleSide}));cone.position.y=1.18;scene.add(cone);
const rimRing=new THREE.Mesh(new THREE.TorusGeometry(1.08,.055,16,64),new THREE.MeshStandardMaterial({color:0xf5f2e8}));rimRing.rotation.x=Math.PI/2;rimRing.position.y=1.99;scene.add(rimRing);

const BED_RADIUS=.70,GRID=25,bedCanvas=document.createElement('canvas');bedCanvas.width=bedCanvas.height=GRID;const bctx=bedCanvas.getContext('2d'),bedImage=bctx.createImageData(GRID,GRID),wet=new Float32Array(GRID*GRID),valid=new Uint8Array(GRID*GRID);
for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){const nx=(x+.5)/GRID*2-1,nz=(y+.5)/GRID*2-1;if(nx*nx+nz*nz<=1)valid[y*GRID+x]=1}
const bedTexture=new THREE.CanvasTexture(bedCanvas);bedTexture.magFilter=THREE.LinearFilter;bedTexture.minFilter=THREE.LinearFilter;const bed=new THREE.Mesh(new THREE.CircleGeometry(.73,64),new THREE.MeshStandardMaterial({map:bedTexture,roughness:1}));bed.rotation.x=-Math.PI/2;bed.position.y=1.16;scene.add(bed);
let coverage=0,uniformity=1,hotspot=0;
function paintBed(){let covered=0,total=0,sum=0,sum2=0,max=0;for(let i=0;i<wet.length;i++){const p=i*4;if(!valid[i]){bedImage.data[p+3]=0;continue}total++;const w=wet[i];sum+=w;sum2+=w*w;if(w>.18)covered++;if(w>max)max=w;const v=Math.min(1,w);bedImage.data[p]=Math.round(75-39*v);bedImage.data[p+1]=Math.round(42-20*v);bedImage.data[p+2]=Math.round(24-12*v);bedImage.data[p+3]=255}bctx.putImageData(bedImage,0,0);bedTexture.needsUpdate=true;coverage=total?covered/total:0;const mean=total?sum/total:0,variance=total?Math.max(0,sum2/total-mean*mean):0;uniformity=mean<.04?1:Math.max(0,1-Math.sqrt(variance)/(mean*1.55));hotspot=mean>.03?max/mean:0;$('coverage').textContent=`${Math.round(coverage*100)}%`;$('uniformity').textContent=`${Math.round(uniformity*100)}%`}
function wetBed(x,z,grams){const gx=(x/BED_RADIUS*.5+.5)*GRID,gz=(z/BED_RADIUS*.5+.5)*GRID,sigma=2.1;for(let iy=Math.max(0,Math.floor(gz-6));iy<Math.min(GRID,Math.ceil(gz+6));iy++)for(let ix=Math.max(0,Math.floor(gx-6));ix<Math.min(GRID,Math.ceil(gx+6));ix++){const i=iy*GRID+ix;if(!valid[i])continue;const d2=(ix+.5-gx)**2+(iy+.5-gz)**2;wet[i]+=grams*Math.exp(-d2/(2*sigma*sigma))*.085}paintBed()}
paintBed();

const kettle=new THREE.Group(),body=new THREE.Mesh(new THREE.SphereGeometry(.42,32,20),new THREE.MeshStandardMaterial({color:0x343432,metalness:.75,roughness:.25}));body.scale.set(1.15,.9,1);kettle.add(body);
const spoutCurve=new THREE.CatmullRomCurve3([new THREE.Vector3(-.25,-.04,0),new THREE.Vector3(-.58,.03,0),new THREE.Vector3(-.92,.18,0),new THREE.Vector3(-1.18,.26,0),new THREE.Vector3(-1.30,.20,0)]),spout=new THREE.Mesh(new THREE.TubeGeometry(spoutCurve,28,.055,12,false),new THREE.MeshStandardMaterial({color:0x444441,metalness:.75,roughness:.22}));kettle.add(spout);
const nozzle=new THREE.Object3D();nozzle.position.set(-1.30,.20,0);kettle.add(nozzle);kettle.position.set(1.72,3.15,.08);scene.add(kettle);
const marker=new THREE.Mesh(new THREE.RingGeometry(.06,.085,32),new THREE.MeshBasicMaterial({color:0xe8c07b,side:THREE.DoubleSide}));marker.rotation.x=-Math.PI/2;marker.position.y=1.185;scene.add(marker);
const ghost=new THREE.Mesh(new THREE.RingGeometry(.075,.11,32),new THREE.MeshBasicMaterial({color:0xa7dfb0,transparent:true,opacity:.88,side:THREE.DoubleSide}));ghost.rotation.x=-Math.PI/2;ghost.position.y=1.19;ghost.visible=false;scene.add(ghost);
const ghostTrailGeometry=new THREE.BufferGeometry(),ghostTrailMaterial=new THREE.LineBasicMaterial({color:0xa7dfb0,transparent:true,opacity:.36}),ghostTrail=new THREE.Line(ghostTrailGeometry,ghostTrailMaterial);ghostTrail.visible=false;scene.add(ghostTrail);

const raycaster=new THREE.Raycaster(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),-1.18),ndc=new THREE.Vector2(),targetPoint=new THREE.Vector3(0,1.18,0);
function targetFromEvent(e){const r=renderer.domElement.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height*2-1));raycaster.setFromCamera(ndc,camera);const hit=new THREE.Vector3();if(!raycaster.ray.intersectPlane(plane,hit))return;const radius=Math.hypot(hit.x,hit.z);if(radius>BED_RADIUS){hit.x*=BED_RADIUS/radius;hit.z*=BED_RADIUS/radius}targetPoint.set(hit.x,1.18,hit.z);marker.position.set(hit.x,1.185,hit.z);kettle.position.set(hit.x+1.72,3.15,hit.z+.08)}

let stream=null,active=false,pouring=false,completed=false,startAt=0,lastT=0,water=0,flow=5,qualityIntegral=0,qualityTime=0,recording=[],lastSampleAt=0,replayData=null,replayStart=0,replaying=false,ghostMode=false,ghostDistanceIntegral=0,ghostFlowIntegral=0,ghostCompareTime=0;
const G=5.5,target=250;
try{replayData=JSON.parse(localStorage.getItem('pourLabLastBrew')||'null')}catch{}
function hasReplay(){return !!replayData?.samples?.length}
$('replay').disabled=!hasReplay();$('ghostMode').disabled=!hasReplay();
function ballisticPoints(start,end){const dy=start.y-end.y,vy=-.18,T=(vy+Math.sqrt(vy*vy+2*G*dy))/G,vx=(end.x-start.x)/T,vz=(end.z-start.z)/T,pts=[];for(let i=0;i<=16;i++){const t=T*i/16;pts.push(new THREE.Vector3(start.x+vx*t,start.y+vy*t-.5*G*t*t,start.z+vz*t))}return pts}
function updateStream(){if(stream){scene.remove(stream);stream.geometry.dispose();stream.material.dispose();stream=null}if(!pouring)return;const start=new THREE.Vector3();nozzle.getWorldPosition(start);stream=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(ballisticPoints(start,targetPoint)),20,.013+flow*.0022,6,false),new THREE.MeshPhysicalMaterial({color:0x9ad8ff,transparent:true,opacity:.72,transmission:.32}));scene.add(stream)}
function fmt(t){return `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`}
function sampleAt(ms){if(!hasReplay())return null;const a=replayData.samples;if(ms<=a[0].t)return a[0];if(ms>=a[a.length-1].t)return a[a.length-1];let lo=0,hi=a.length-1;while(lo+1<hi){const mid=(lo+hi)>>1;if(a[mid].t<ms)lo=mid;else hi=mid}const p=a[lo],q=a[hi],span=Math.max(1,q.t-p.t),u=(ms-p.t)/span;return {t:ms,x:p.x+(q.x-p.x)*u,z:p.z+(q.z-p.z)*u,flow:p.flow+(q.flow-p.flow)*u,water:p.water+(q.water-p.water)*u,pouring:u<.5?p.pouring:q.pouring}}
function buildGhostTrail(){if(!hasReplay()){ghostTrail.visible=false;return}const pts=replayData.samples.filter(s=>s.pouring).map(s=>new THREE.Vector3(s.x,1.192,s.z));ghostTrail.geometry.dispose();ghostTrail.geometry=new THREE.BufferGeometry().setFromPoints(pts);ghostTrail.visible=ghostMode&&pts.length>1}
function updateGhost(ms){if(!hasReplay()){ghost.visible=false;return null}const s=sampleAt(ms);ghost.position.set(s.x,1.19,s.z);ghost.visible=ghostMode||replaying;ghost.material.opacity=s.pouring?.92:.28;return s}
function setCoach(){if(replaying){$('phase').textContent='回放';$('coach').textContent='绿色轨迹显示上一杯真实注水路径';return}if(ghostMode&&active){const d=ghostCompareTime?ghostDistanceIntegral/ghostCompareTime:0,f=ghostCompareTime?ghostFlowIntegral/ghostCompareTime:0;$('phase').textContent='Ghost 跟冲';$('coach').textContent=d<.10&&f<.8?'跟随很稳：空间与流速都接近上杯':d>.20?'落点偏差较大：优先追随绿色 Ghost':'流速偏差较大：调整壶身倾角';return}if(completed){$('phase').textContent='完成';$('coach').textContent=coverage<.72?'覆盖不足：扩大绕圈范围':uniformity<.58||hotspot>4.8?'局部冲刷过强：移动更连续，减少定点停留':uniformity>.82?'粉床分布均匀，表现很好':'覆盖不错，继续改善均匀度';return}if(!active){$('phase').textContent=ghostMode?'Ghost 已就绪':'准备开始';$('coach').textContent=ghostMode?'开始后跟随绿色轨迹与落点':'目标：250g · 建议 4–6 g/s';return}if(water<40){$('phase').textContent='闷蒸';$('coach').textContent=coverage<.55?'扩大落点，让更多粉层湿润':uniformity<.6?'避免停在单点，继续绕圈':'闷蒸覆盖不错'}else if(water<180){$('phase').textContent='主体注水';$('coach').textContent=hotspot>5?'局部冲刷偏强：移动起来':coverage<.76?'仍有干区：适当扩大绕圈':'保持稳定注水'}else{$('phase').textContent='收尾';$('coach').textContent='逐渐回到中心，接近 250g'}}
function clearBrewState(){active=false;pouring=false;completed=false;replaying=false;water=0;flow=Number($('flowControl').value);qualityIntegral=0;qualityTime=0;recording=[];lastSampleAt=0;ghostDistanceIntegral=0;ghostFlowIntegral=0;ghostCompareTime=0;wet.fill(0);paintBed();targetPoint.set(0,1.18,0);marker.position.set(0,1.185,0);kettle.position.set(1.72,3.15,.08);kettle.rotation.z=0;updateStream();$('time').textContent='0:00';$('water').textContent='0g';$('flow').textContent='0.0';$('bar').style.width='0%';$('score').textContent='评分 --';$('ghostDelta').textContent='--';$('hint').classList.remove('hide');ghost.visible=false;buildGhostTrail();setCoach()}
function begin(){clearBrewState();active=true;startAt=performance.now();lastT=startAt;$('hint').classList.add('hide');$('start').textContent='训练中';buildGhostTrail();setCoach()}
function finish(){active=false;pouring=false;completed=true;kettle.rotation.z=0;updateStream();const base=qualityTime?qualityIntegral/qualityTime:0,bedScore=.55*coverage+.45*uniformity;let score=Math.round(100*(.68*base+.32*bedScore));let ghostText='';if(ghostMode&&ghostCompareTime){const avgD=ghostDistanceIntegral/ghostCompareTime,avgF=ghostFlowIntegral/ghostCompareTime,follow=Math.max(0,1-avgD/.32)*.65+Math.max(0,1-avgF/2.5)*.35;score=Math.round(score*.72+follow*100*.28);ghostText=` · 跟冲 ${Math.round(follow*100)}`}$('score').textContent=`评分 ${score}${ghostText}`;$('start').textContent='再来一杯';recording.push({t:performance.now()-startAt,x:targetPoint.x,z:targetPoint.z,flow,water,pouring:false});replayData={version:2,createdAt:new Date().toISOString(),duration:performance.now()-startAt,score,samples:recording};try{localStorage.setItem('pourLabLastBrew',JSON.stringify(replayData))}catch{}$('replay').disabled=false;$('ghostMode').disabled=false;buildGhostTrail();setCoach()}
function startReplay(){if(!hasReplay())return;clearBrewState();ghostMode=false;$('modeLabel').textContent='V60 · REPLAY';$('ghostMode').textContent='跟冲上杯';replaying=true;replayStart=performance.now();ghostTrail.visible=true;$('hint').classList.add('hide');setCoach()}
function toggleGhost(){if(!hasReplay())return;ghostMode=!ghostMode;$('ghostMode').textContent=ghostMode?'退出跟冲':'跟冲上杯';$('modeLabel').textContent=ghostMode?'V60 · GHOST':'V60 · TRAINING';$('tipText').textContent=ghostMode?'绿色轨迹 = 上一杯路径；GHOST Δ = 当前落点偏差':'粉床会记录局部湿润与过度冲刷';clearBrewState();buildGhostTrail();setCoach()}
$('start').onclick=begin;$('reset').onclick=()=>{ghostMode=false;$('ghostMode').textContent='跟冲上杯';$('modeLabel').textContent='V60 · TRAINING';$('tipText').textContent='粉床会记录局部湿润与过度冲刷';clearBrewState();$('start').textContent='开始训练'};$('replay').onclick=startReplay;$('ghostMode').onclick=toggleGhost;
$('flowControl').oninput=e=>{flow=Number(e.target.value);$('flowSet').textContent=`${flow.toFixed(1)} g/s`;if(pouring)updateStream()};
renderer.domElement.addEventListener('pointerdown',e=>{if(replaying)return;if(!active)begin();renderer.domElement.setPointerCapture(e.pointerId);targetFromEvent(e);pouring=true;kettle.rotation.z=-.10-(flow-2)/6*.16;updateStream()});
renderer.domElement.addEventListener('pointermove',e=>{if(replaying)return;targetFromEvent(e);if(pouring)updateStream()});
const stopPour=()=>{pouring=false;kettle.rotation.z=0;updateStream()};renderer.domElement.addEventListener('pointerup',stopPour);renderer.domElement.addEventListener('pointercancel',stopPour);
function animate(now){requestAnimationFrame(animate);const dt=Math.min(.05,(now-(lastT||now))/1000);lastT=now;if(replaying){const elapsed=now-replayStart,s=updateGhost(elapsed);if(s){$('time').textContent=fmt(elapsed/1000);$('water').textContent=`${Math.round(s.water)}g`;$('flow').textContent=(s.pouring?s.flow:0).toFixed(1);$('bar').style.width=`${Math.min(100,s.water/target*100)}%`}if(elapsed>=replayData.duration){replaying=false;ghost.visible=false;ghostTrail.visible=false;$('phase').textContent='回放完成';$('coach').textContent='可以进入 Ghost 跟冲，尝试复现这一杯';$('modeLabel').textContent='V60 · TRAINING'}}else if(active){const elapsed=now-startAt;$('time').textContent=fmt(elapsed/1000);const gs=ghostMode?updateGhost(elapsed):null;if(pouring){const added=Math.min(flow*dt,target-water);water+=added;wetBed(targetPoint.x,targetPoint.z,added);const center=Math.hypot(targetPoint.x,targetPoint.z),flowScore=Math.max(0,1-Math.abs(flow-5)/3.2),edgeScore=Math.max(0,1-Math.max(0,center-.56)*4);qualityIntegral+=(flowScore*.72+edgeScore*.28)*dt;qualityTime+=dt;if(gs&&gs.pouring){const d=Math.hypot(targetPoint.x-gs.x,targetPoint.z-gs.z),fd=Math.abs(flow-gs.flow);ghostDistanceIntegral+=d*dt;ghostFlowIntegral+=fd*dt;ghostCompareTime+=dt;$('ghostDelta').textContent=`${Math.round(d*100)}cm`}}if(now-lastSampleAt>=100){recording.push({t:elapsed,x:targetPoint.x,z:targetPoint.z,flow,water,pouring});lastSampleAt=now}$('water').textContent=`${Math.round(water)}g`;$('flow').textContent=(pouring?flow:0).toFixed(1);$('bar').style.width=`${Math.min(100,water/target*100)}%`;setCoach();if(water>=target-.0001)finish()}renderer.render(scene,camera)}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
